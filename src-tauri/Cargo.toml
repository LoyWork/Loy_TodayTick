[package]
name = "todaytick"
version = "2.1.0"
description = "TodayTick · 轻量定时提醒"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
window-vibrancy = "0.6"
winreg = "0.55"

[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
